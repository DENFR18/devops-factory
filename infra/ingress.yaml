# Ingress centralisé — toutes les stacks ESN
# IP LoadBalancer : 20.240.2.187
# Pattern URL : <stack>.20.240.2.187.nip.io

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-esn-portal
  namespace: esn-portal
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - host: esn-portal.20.240.2.187.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-factory
                port:
                  number: 80

