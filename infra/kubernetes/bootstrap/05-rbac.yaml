apiVersion: v1
kind: ServiceAccount
metadata:
  name: alpha-deployer
  namespace: tenant-alpha
  labels:
    app.kubernetes.io/name: alpha-deployer
    app.kubernetes.io/part-of: tenants
    tenant: alpha
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-deployer
  namespace: tenant-alpha
  labels:
    app.kubernetes.io/name: tenant-deployer
    app.kubernetes.io/part-of: tenants
    tenant: alpha
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alpha-deployer
  namespace: tenant-alpha
  labels:
    app.kubernetes.io/name: alpha-deployer
    app.kubernetes.io/part-of: tenants
    tenant: alpha
subjects:
  - kind: ServiceAccount
    name: alpha-deployer
    namespace: tenant-alpha
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-deployer
