apiVersion: v1
kind: Service
metadata:
  name: {{ include "service-alpha.name" . }}
  labels:
    {{- include "service-alpha.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "service-alpha.selectorLabels" . | nindent 4 }}
