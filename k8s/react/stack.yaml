---
# Image à builder et pusher dans ACR par le 3ème coéquipier
# Remplacer <ACR_URL> par : acrdevopsfactorydev.azurecr.io
# L'app React doit être buildée et servie via nginx
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app
  namespace: stack-react
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
        - name: react-app
          image: acrdevopsfactorydev.azurecr.io/react-app:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: react-app
  namespace: stack-react
spec:
  selector:
    app: react-app
  ports:
    - port: 80
      targetPort: 80
