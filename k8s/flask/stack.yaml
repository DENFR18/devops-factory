---
# Image à builder et pusher dans ACR par le 3ème coéquipier
# Remplacer <ACR_URL> par : acrdevopsfactorydev.azurecr.io
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
  namespace: stack-flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
        - name: flask-api
          image: acrdevopsfactorydev.azurecr.io/flask-api:latest
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_ENV
              value: "production"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flask-api
  namespace: stack-flask
spec:
  selector:
    app: flask-api
  ports:
    - port: 5000
      targetPort: 5000
