apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cloud-forge
    tenant: node-api
spec:
  project: default
  source:
    repoURL: https://github.com/DENFR18/devops-factory.git
    targetRevision: HEAD
    path: charts/node-api
  destination:
    server: https://kubernetes.default.svc
    namespace: node-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
