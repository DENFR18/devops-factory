apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stack-nextcloud
  namespace: argocd
  labels:
    app.kubernetes.io/name: stack-nextcloud
    app.kubernetes.io/part-of: app-catalog
spec:
  project: default
  source:
    repoURL: https://github.com/DENFR18/devops-factory.git
    targetRevision: HEAD
    path: charts/nextcloud
  destination:
    server: https://kubernetes.default.svc
    namespace: stack-nextcloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
