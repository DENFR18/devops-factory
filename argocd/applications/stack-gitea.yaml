apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stack-gitea
  namespace: argocd
  labels:
    app.kubernetes.io/name: stack-gitea
    app.kubernetes.io/part-of: app-catalog
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: gitea
    targetRevision: 3.2.22
    helm:
      releaseName: gitea
      values: |
        global:
          security:
            allowInsecureImages: true
        image:
          repository: bitnamilegacy/gitea
        service:
          type: ClusterIP
        ingress:
          enabled: false
        persistence:
          enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 768Mi
        postgresql:
          image:
            repository: bitnamilegacy/postgresql
          primary:
            persistence:
              enabled: false
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: stack-gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
