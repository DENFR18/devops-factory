apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenant-beta
  namespace: argocd
  labels:
    app.kubernetes.io/name: tenant-beta
    app.kubernetes.io/part-of: tenants
    tenant: beta
spec:
  description: Tenant beta applications
  sourceRepos:
    - https://github.com/DENFR18/devops-factory.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: tenant-beta
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
