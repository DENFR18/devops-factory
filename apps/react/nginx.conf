server {
    listen 8080; # NOSONAR - TLS terminated at NGINX Ingress Controller, plain HTTP inside the pod is expected
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / { # NOSONAR - static assets served publicly, auth enforced at ingress level
        try_files $uri $uri/ /index.html;
    }

    # Health endpoint
    location /health { # NOSONAR - health check intentionally public, no sensitive data
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"react"}';
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
