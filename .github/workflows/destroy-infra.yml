# ──────────────────────────────────────────────────────────────────────────────
# ⚠️  CE WORKFLOW DÉTRUIT L'INFRASTRUCTURE — NE PAS LANCER EN PROD SANS VALIDATION
#
# Destroy Infrastructure
#
# Workflow opérationnel pour détruire l'infrastructure Terraform d'un
# environnement (typiquement en fin de session de dev pour éviter les coûts).
#
# Protections en place :
#   1. Input confirm="destroy" obligatoire — le workflow s'arrête immédiatement
#      si la valeur est absente ou incorrecte.
#   2. L'environnement GitHub (dev ou prod) doit avoir une protection
#      "Required reviewers" dans Settings → Environments — un reviewer humain
#      doit approuver avant que le destroy s'exécute.
#
# ⚠️  IL N'Y A PAS DE UNDO. Vérifier le plan destroy avant d'approuver.
#
# Required GitHub Secrets : SCW_ACCESS_KEY, SCW_SECRET_KEY, SCW_DEFAULT_PROJECT_ID
# ──────────────────────────────────────────────────────────────────────────────

name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy (dev or prod)'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: 'Type "destroy" to confirm'
        required: true
        type: string

env:
  TF_VERSION: "1.7.5"
  SCW_DEFAULT_REGION: fr-par
  SCW_DEFAULT_ZONE: fr-par-1
  TF_STATE_BUCKET_DEV: devops-factory-tfstate-dev
  TF_STATE_BUCKET_PROD: devops-factory-tfstate-prod
  SCW_S3_ENDPOINT: https://s3.fr-par.scw.cloud
  # S3 backend credentials
  AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
  AWS_DEFAULT_REGION: fr-par
  # Scaleway provider credentials (read directly from env by the provider)
  SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
  SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
  # Terraform variable
  TF_VAR_project_id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
  SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

# One destroy per environment at a time — never cancel a destroy in progress.
concurrency:
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy:
    name: "⚠️ Destroy ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      contents: read

    steps:
      - name: Validate confirmation input
        env:
          CONFIRM: ${{ inputs.confirm }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM}" != "destroy" ]; then
            echo "❌ Confirmation invalide. Tu dois taper exactement 'destroy'."
            echo "   Workflow annulé pour éviter une destruction accidentelle."
            exit 1
          fi
          echo "✅ Confirmation reçue — destruction autorisée pour ${ENVIRONMENT}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Cleanup Kubernetes LoadBalancers
        if: inputs.environment == 'dev'
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          set -euo pipefail

          CLUSTER_ID="$(curl -fsSL \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters" \
            | jq -r '.clusters[] | select(.name == "devops-factory-dev") | .id' \
            | head -n 1)"

          if [ -z "${CLUSTER_ID}" ]; then
            echo "Aucun cluster devops-factory-dev detecte, nettoyage Kubernetes ignore."
            exit 0
          fi

          if ! curl -fsSL \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters/${CLUSTER_ID}/kubeconfig?dl=1" \
            -o kubeconfig.yaml; then
            echo "Kubeconfig indisponible, le cluster est probablement deja en suppression."
            exit 0
          fi

          export KUBECONFIG="$(pwd)/kubeconfig.yaml"

          echo "Suppression des services Kubernetes de type LoadBalancer..."
          kubectl get svc --all-namespaces \
            -o custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name,TYPE:.spec.type \
            --no-headers \
            | awk '$3 == "LoadBalancer" {print $1, $2}' \
            | while read -r ns name; do
                echo "Suppression du service ${ns}/${name}"
                kubectl -n "${ns}" delete svc "${name}" --ignore-not-found=true
              done || true

          echo "Attente de liberation des LoadBalancers Scaleway..."
          sleep 90

      - name: Terraform Init
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        env:
          TF_BACKEND_BUCKET: devops-factory-tfstate-${{ inputs.environment }}
        run: |
          set -euo pipefail
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${SCW_DEFAULT_REGION}" \
            -input=false \
            -reconfigure

      - name: Terraform Plan Destroy
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: |
          set -euo pipefail
          terraform plan \
            -destroy \
            -out=tfplan-destroy \
            -input=false \
            -no-color

      - name: Show Destroy Plan
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: |
          set -euo pipefail
          terraform show -no-color tfplan-destroy

      - name: Terraform Destroy
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Creation d'un plan destroy frais, tentative ${attempt}/3..."
            terraform plan \
              -destroy \
              -out="tfplan-destroy-${attempt}" \
              -input=false \
              -no-color

            if terraform apply -auto-approve "tfplan-destroy-${attempt}"; then
              exit 0
            fi
            echo "Destroy encore bloque, tentative ${attempt}/3. Attente avant nouvel essai..."
            sleep 120
          done
          echo "Destroy impossible apres 3 tentatives."
          exit 1

      - name: Confirmation finale
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          echo "════════════════════════════════════════════════"
          echo "  🗑️  Infrastructure ${ENVIRONMENT} détruite avec succès."
          echo ""
          echo "  ℹ️  Si tu ne redéploies pas :"
          echo "     → Pense à supprimer CLUSTER_ID_${ENVIRONMENT} de"
          echo "       tes secrets GitHub si tu en avais configuré un."
          echo "════════════════════════════════════════════════"
