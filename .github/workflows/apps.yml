# ──────────────────────────────────────────────────────────────────────────────
# Applications — DevSecOps
#
# Matrix pipeline covering all services in apps/:
#   service-alpha  Python / FastAPI
#   node-api       Node.js / Express
#   react          React / nginx
#
# Stages per service: ci (lint + test) → sonarcloud → build-push → trivy-scan
#                                                                 → update-image-tag (main/develop only)
#
# Required GitHub Secrets:
#   SCW_SECRET_KEY   — Scaleway SCR password (username: nologin)
#   SONAR_TOKEN      — SonarCloud analysis token
#   SONAR_HOST_URL   — https://sonarcloud.io
# ──────────────────────────────────────────────────────────────────────────────

name: Applications — DevSecOps

on:
  push:
    branches: [main, develop, refactor/devsecops-v2]
    paths:
      - "apps/**"
      - "charts/**"
      - ".github/workflows/apps.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "charts/**"
  workflow_dispatch:

env:
  SCW_REGISTRY: rg.fr-par.scw.cloud
  SCW_REGISTRY_NAMESPACE: devops-factory

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. CI — lint + test ───────────────────────────────────────────────────
  ci:
    name: CI — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: service-alpha
            path: apps/service-alpha
            language: python
            python-version: "3.12"
          - service: node-api
            path: apps/node-api
            language: node
            node-version: "20"
          - service: react
            path: apps/react
            language: node
            node-version: "20"

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # ── Python ──────────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        if: matrix.language == 'python'
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements-dev.txt

      - name: Install Python dependencies
        if: matrix.language == 'python'
        working-directory: ${{ matrix.path }}
        run: pip install --quiet -r requirements-dev.txt

      - name: Lint — Python
        if: matrix.language == 'python'
        working-directory: ${{ matrix.path }}
        run: |
          ruff check .
          black --check .

      - name: Test — Python
        if: matrix.language == 'python'
        working-directory: ${{ matrix.path }}
        run: |
          pytest \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            --junitxml=junit.xml \
            -v

      - name: Upload Python coverage
        if: matrix.language == 'python'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.path }}/coverage.xml
          retention-days: 7

      # ── Node ────────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        if: matrix.language == 'node'
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Node dependencies
        if: matrix.language == 'node'
        working-directory: ${{ matrix.path }}
        run: npm install

      - name: Lint — Node
        if: matrix.language == 'node'
        working-directory: ${{ matrix.path }}
        run: npm run lint

      - name: Test — Node
        if: matrix.language == 'node'
        working-directory: ${{ matrix.path }}
        run: npm test

  # ── 2. SonarCloud ────────────────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: service-alpha
            path: apps/service-alpha
          - service: node-api
            path: apps/node-api
          - service: react
            path: apps/react

    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.path }}
        continue-on-error: true

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          projectBaseDir: ${{ matrix.path }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

  # ── 3. Build & Push ──────────────────────────────────────────────────────
  build-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: service-alpha
            path: apps/service-alpha
          - service: node-api
            path: apps/node-api
          - service: react
            path: apps/react

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SCW_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SCW_REGISTRY }}/${{ env.SCW_REGISTRY_NAMESPACE }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Save image tag
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: printf '%s' "${IMAGE_VERSION}" > "/tmp/image-tag-${SERVICE}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: image-tag-${{ matrix.service }}
          path: /tmp/image-tag-${{ matrix.service }}.txt
          retention-days: 1

  # ── 4. Trivy image scan ──────────────────────────────────────────────────
  trivy-scan:
    name: Trivy — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [build-push]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: service-alpha
          - service: node-api
          - service: react

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Download image tag
        uses: actions/download-artifact@v4
        with:
          name: image-tag-${{ matrix.service }}
          path: /tmp

      - name: Read image tag
        id: tag
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "value=$(cat /tmp/image-tag-${SERVICE}.txt)" >> "$GITHUB_OUTPUT"

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SCW_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.SCW_REGISTRY }}/${{ env.SCW_REGISTRY_NAMESPACE }}/${{ matrix.service }}:${{ steps.tag.outputs.value }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # ── 5. Update image tag — GitOps ─────────────────────────────────────────
  update-image-tag:
    name: Update image tag — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [build-push]
    if: >
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/develop' ||
       github.ref == 'refs/heads/refactor/devsecops-v2')
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: service-alpha
            values: argocd/tenants/alpha/values.yaml
          - service: node-api
            values: argocd/tenants/beta/values.yaml
          - service: react
            values: argocd/tenants/gamma/values.yaml

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image tag
        uses: actions/download-artifact@v4
        with:
          name: image-tag-${{ matrix.service }}
          path: /tmp

      - name: Update chart values
        env:
          SERVICE: ${{ matrix.service }}
          VALUES: ${{ matrix.values }}
          SCW_REGISTRY: ${{ env.SCW_REGISTRY }}
          SCW_REGISTRY_NAMESPACE: ${{ env.SCW_REGISTRY_NAMESPACE }}
        run: |
          set -euo pipefail
          IMAGE_TAG="$(cat /tmp/image-tag-${SERVICE}.txt)"
          if [ -f "${VALUES}" ]; then
            sed -i "s|  tag:.*|  tag: \"${IMAGE_TAG}\"|" "${VALUES}"
            echo "${VALUES} → ${SERVICE}:${IMAGE_TAG}"
          else
            echo "WARNING: ${VALUES} not found — skipping"
          fi

      - name: Commit and push
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          IMAGE_TAG="$(cat /tmp/image-tag-${SERVICE}.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add argocd/tenants/
          if git diff --staged --quiet; then
            echo "No changes — tag already up to date"
          else
            git commit -m "chore(k8s): update ${SERVICE} image to ${IMAGE_TAG} [skip ci]"
            git push
          fi
