# ──────────────────────────────────────────────────────────────────────────────
# Applications — DevSecOps
#
# Pipeline: lint → test → sonarcloud
#                └→ build-push → trivy-scan → update-image-tag (GitOps)
#
# Triggers:
#   - push to main or develop (app source / Dockerfile / Helm chart changes)
#   - pull_request targeting main (lint + test + sonarcloud only — no image push)
#   - workflow_dispatch (manual)
#
# Image registry: Scaleway SCR (rg.fr-par.scw.cloud)
# Tag strategy:   sha-<short-sha> — no "latest" tag, ever.
#
# GitOps deploy: update-image-tag commits the new tag into helm-chart/values-*.yaml.
# ArgoCD detects the change and syncs the cluster automatically.
#
# Required GitHub Secrets:
#   SCW_SECRET_KEY          — Scaleway secret key (SCR docker login password)
#   SONAR_TOKEN             — SonarCloud analysis token
#   SONAR_HOST_URL          — https://sonarcloud.io
# ──────────────────────────────────────────────────────────────────────────────

name: Applications — DevSecOps

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "app.js"
      - "frontend/**"
      - "Dockerfile"
      - "package*.json"
      - "helm-chart/**"
      - "sonar-project.properties"
  pull_request:
    branches:
      - main
    paths:
      - "app.js"
      - "frontend/**"
      - "Dockerfile"
      - "package*.json"
      - "helm-chart/**"
      - "sonar-project.properties"
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  SCW_REGISTRY: rg.fr-par.scw.cloud
  # Must match the namespace created by the container-registry Terraform module.
  SCW_REGISTRY_NAMESPACE: devops-factory
  IMAGE_NAME: devops-factory

# One pipeline per branch — never cancel a running build.
concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # ── 2. test ──────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  # ── 3. sonarcloud ─────────────────────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: [lint, test]

    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history required for accurate blame data and new-code detection.
          fetch-depth: 0

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@e44258b109568baa0df60ed515909fc6c72cba92 # v3.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ── 4. build-push ─────────────────────────────────────────────────────────────
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name != 'pull_request'

    permissions:
      contents: read

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961aba86604d28c75b49 # v3.4.0
        with:
          registry: ${{ env.SCW_REGISTRY }}
          # Scaleway SCR authentication: any username, secret key as password.
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbea8a58e42e37c37563e0aab34e # v5.7.0
        with:
          images: ${{ env.SCW_REGISTRY }}/${{ env.SCW_REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
          # No "latest" tag — ever (CLAUDE.md security rule).

      - name: Build and push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2ed73f36252b1b4f46fd # v6.15.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── 5. trivy-scan ─────────────────────────────────────────────────────────────
  trivy-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: [build-push]

    permissions:
      contents: read
      security-events: write  # required for SARIF upload to Security tab

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961aba86604d28c75b49 # v3.4.0
        with:
          registry: ${{ env.SCW_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # 0.30.0
        with:
          image-ref: ${{ env.SCW_REGISTRY }}/${{ env.SCW_REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.image-tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Only fail on vulnerabilities that have a fix available — avoids
          # blocking on unfixed upstream CVEs in the base node:20 image.
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

  # ── 6. update-image-tag (GitOps) ──────────────────────────────────────────────
  update-image-tag:
    name: Update image tag (GitOps)
    runs-on: ubuntu-latest
    needs: [trivy-scan, sonarcloud]
    if: >
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    permissions:
      contents: write  # required to commit updated Helm values

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Use GITHUB_TOKEN — pushes made with it do NOT retrigger workflows.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in values-dev.yaml
        env:
          IMAGE_REPO: ${{ env.SCW_REGISTRY }}/${{ env.SCW_REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-push.outputs.image-tag }}
        run: |
          set -euo pipefail
          sed -i "s|  repository:.*|  repository: \"${IMAGE_REPO}\"|" helm-chart/values-dev.yaml
          sed -i "s|  tag:.*|  tag: \"${IMAGE_TAG}\"|" helm-chart/values-dev.yaml
          echo "helm-chart/values-dev.yaml → ${IMAGE_REPO}:${IMAGE_TAG}"

      - name: Update image tag in values-prod.yaml
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_REPO: ${{ env.SCW_REGISTRY }}/${{ env.SCW_REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-push.outputs.image-tag }}
        run: |
          set -euo pipefail
          if [ -f helm-chart/values-prod.yaml ]; then
            sed -i "s|  repository:.*|  repository: \"${IMAGE_REPO}\"|" helm-chart/values-prod.yaml
            sed -i "s|  tag:.*|  tag: \"${IMAGE_TAG}\"|" helm-chart/values-prod.yaml
            echo "helm-chart/values-prod.yaml → ${IMAGE_REPO}:${IMAGE_TAG}"
          else
            echo "helm-chart/values-prod.yaml not found — skipping"
          fi

      - name: Commit and push updated values
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image-tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add helm-chart/values-dev.yaml
          git add helm-chart/values-prod.yaml 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes — image tag already up to date"
          else
            git commit -m "chore(k8s): update image tag to ${IMAGE_TAG} [skip ci]"
            git push
          fi
