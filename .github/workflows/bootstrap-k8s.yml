name: Bootstrap Kubernetes Platform

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Bootstrap platform or retrieve the initial ArgoCD admin password"
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - get-argocd-password
          - reset-argocd-password
          - diagnose-apps

env:
  SCW_DEFAULT_REGION: fr-par
  SCW_DEFAULT_ZONE: fr-par-1

jobs:
  bootstrap-namespaces:
    name: Bootstrap namespaces and policies
    runs-on: ubuntu-latest
    if: inputs.task == 'bootstrap'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get kubeconfig
        run: |
          CLUSTER_ID="${CLUSTER_ID_DEV:-}"
          if [ -z "${CLUSTER_ID}" ]; then
            CLUSTER_ID="$(curl -fsSL \
              -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
              "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters" \
              | jq -r '.clusters[] | select(.name == "devops-factory-dev") | .id' \
              | head -n 1)"
          fi
          test -n "${CLUSTER_ID}"
          curl -fsSL \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters/${CLUSTER_ID}/kubeconfig?dl=1" \
            -o kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          CLUSTER_ID_DEV: ${{ secrets.CLUSTER_ID_DEV }}

      - name: Apply bootstrap manifests
        run: |
          kubectl apply -f infra/kubernetes/bootstrap/01-namespaces.yaml
          kubectl apply -f infra/kubernetes/bootstrap/02-resource-quotas.yaml
          kubectl apply -f infra/kubernetes/bootstrap/03-limit-ranges.yaml
          kubectl apply -f infra/kubernetes/bootstrap/04-network-policies.yaml
          kubectl apply -f infra/kubernetes/bootstrap/05-rbac.yaml

  bootstrap-ingress-nginx:
    name: Bootstrap ingress-nginx
    runs-on: ubuntu-latest
    needs: bootstrap-namespaces
    if: inputs.task == 'bootstrap'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get kubeconfig
        run: |
          CLUSTER_ID="${CLUSTER_ID_DEV:-}"
          if [ -z "${CLUSTER_ID}" ]; then
            CLUSTER_ID="$(curl -fsSL \
              -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
              "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters" \
              | jq -r '.clusters[] | select(.name == "devops-factory-dev") | .id' \
              | head -n 1)"
          fi
          test -n "${CLUSTER_ID}"
          curl -fsSL \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters/${CLUSTER_ID}/kubeconfig?dl=1" \
            -o kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          CLUSTER_ID_DEV: ${{ secrets.CLUSTER_ID_DEV }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install ingress-nginx
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --values infra/kubernetes/bootstrap/helm-values/ingress-nginx-values.yaml \
            --wait \
            --timeout 5m

  bootstrap-cert-manager:
    name: Bootstrap cert-manager
    runs-on: ubuntu-latest
    needs: bootstrap-ingress-nginx
    if: inputs.task == 'bootstrap'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get kubeconfig
        run: |
          CLUSTER_ID="${CLUSTER_ID_DEV:-}"
          if [ -z "${CLUSTER_ID}" ]; then
            CLUSTER_ID="$(curl -fsSL \
              -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
              "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters" \
              | jq -r '.clusters[] | select(.name == "devops-factory-dev") | .id' \
              | head -n 1)"
          fi
          test -n "${CLUSTER_ID}"
          curl -fsSL \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters/${CLUSTER_ID}/kubeconfig?dl=1" \
            -o kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          CLUSTER_ID_DEV: ${{ secrets.CLUSTER_ID_DEV }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install cert-manager
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --set installCRDs=true \
            --values infra/kubernetes/bootstrap/helm-values/cert-manager-values.yaml \
            --wait \
            --timeout 5m

  bootstrap-sealed-secrets:
    name: Bootstrap sealed-secrets
    runs-on: ubuntu-latest
    needs: bootstrap-cert-manager
    if: inputs.task == 'bootstrap'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get kubeconfig
        run: |
          CLUSTER_ID="${CLUSTER_ID_DEV:-}"
          if [ -z "${CLUSTER_ID}" ]; then
            CLUSTER_ID="$(curl -fsSL \
              -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
              "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters" \
              | jq -r '.clusters[] | select(.name == "devops-factory-dev") | .id' \
              | head -n 1)"
          fi
          test -n "${CLUSTER_ID}"
          curl -fsSL \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters/${CLUSTER_ID}/kubeconfig?dl=1" \
            -o kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          CLUSTER_ID_DEV: ${{ secrets.CLUSTER_ID_DEV }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install sealed-secrets
        run: |
          helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
          helm repo update
          helm upgrade --install sealed-secrets sealed-secrets/sealed-secrets \
            --namespace sealed-secrets \
            --values infra/kubernetes/bootstrap/helm-values/sealed-secrets-values.yaml \
            --wait \
            --timeout 5m

  bootstrap-argocd:
    name: Bootstrap ArgoCD
    runs-on: ubuntu-latest
    needs:
      - bootstrap-ingress-nginx
      - bootstrap-cert-manager
      - bootstrap-sealed-secrets
    if: inputs.task == 'bootstrap'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get kubeconfig
        run: |
          CLUSTER_ID="${CLUSTER_ID_DEV:-}"
          if [ -z "${CLUSTER_ID}" ]; then
            CLUSTER_ID="$(curl -fsSL \
              -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
              "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters" \
              | jq -r '.clusters[] | select(.name == "devops-factory-dev") | .id' \
              | head -n 1)"
          fi
          test -n "${CLUSTER_ID}"
          curl -fsSL \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters/${CLUSTER_ID}/kubeconfig?dl=1" \
            -o kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          CLUSTER_ID_DEV: ${{ secrets.CLUSTER_ID_DEV }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install ArgoCD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --values infra/kubernetes/bootstrap/helm-values/argocd-values.yaml \
            --wait \
            --timeout 10m

      - name: Wait for ArgoCD CRDs
        run: |
          kubectl wait --for condition=established crd/applications.argoproj.io --timeout=60s
          kubectl wait --for condition=established crd/appprojects.argoproj.io --timeout=60s

  bootstrap-root-app:
    name: Bootstrap root app
    runs-on: ubuntu-latest
    needs: bootstrap-argocd
    if: inputs.task == 'bootstrap'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get kubeconfig
        run: |
          CLUSTER_ID="${CLUSTER_ID_DEV:-}"
          if [ -z "${CLUSTER_ID}" ]; then
            CLUSTER_ID="$(curl -fsSL \
              -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
              "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters" \
              | jq -r '.clusters[] | select(.name == "devops-factory-dev") | .id' \
              | head -n 1)"
          fi
          test -n "${CLUSTER_ID}"
          curl -fsSL \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters/${CLUSTER_ID}/kubeconfig?dl=1" \
            -o kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          CLUSTER_ID_DEV: ${{ secrets.CLUSTER_ID_DEV }}

      - name: Apply root app
        run: |
          kubectl apply -f argocd/root-app.yaml
          kubectl wait -n argocd --for=jsonpath='{.status.sync.status}'=Synced \
            application/root --timeout=300s || {
              echo "::warning::L'application root ArgoCD est encore en reconciliation; publication des liens nip.io maintenue"
              kubectl -n argocd get application root -o wide || true
            }

      - name: Print nip.io ingress URLs
        run: |
          for i in $(seq 1 60); do
            INGRESS_IP="$(kubectl -n ingress-nginx get svc ingress-nginx-controller \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
            if [ -n "${INGRESS_IP}" ]; then
              break
            fi
            sleep 10
          done

          test -n "${INGRESS_IP}"
          ARGOCD_HOST="argocd.${INGRESS_IP}.nip.io"
          PORTAL_HOST="portal.${INGRESS_IP}.nip.io"

          kubectl -n argocd create configmap access-portal \
            --from-file=index.html=frontend/access-portal/index.html \
            --from-file=styles.css=frontend/access-portal/styles.css \
            --from-file=portal.js=frontend/access-portal/portal.js \
            --dry-run=client -o yaml | kubectl apply -f -

          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: access-portal
            namespace: argocd
            labels:
              app.kubernetes.io/name: access-portal
              app.kubernetes.io/part-of: platform
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: access-portal
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: access-portal
                  app.kubernetes.io/part-of: platform
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 101
                  runAsGroup: 101
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: nginx
                    image: nginxinc/nginx-unprivileged:1.27-alpine
                    ports:
                      - containerPort: 8080
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    resources:
                      requests:
                        cpu: 25m
                        memory: 32Mi
                      limits:
                        cpu: 100m
                        memory: 128Mi
                    volumeMounts:
                      - name: site
                        mountPath: /usr/share/nginx/html
                      - name: cache
                        mountPath: /var/cache/nginx
                      - name: run
                        mountPath: /var/run
                volumes:
                  - name: site
                    configMap:
                      name: access-portal
                  - name: cache
                    emptyDir: {}
                  - name: run
                    emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: access-portal
            namespace: argocd
            labels:
              app.kubernetes.io/name: access-portal
              app.kubernetes.io/part-of: platform
          spec:
            type: ClusterIP
            selector:
              app.kubernetes.io/name: access-portal
            ports:
              - name: http
                port: 80
                targetPort: 8080
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: access-portal-nip-io
            namespace: argocd
          spec:
            ingressClassName: nginx
            rules:
              - host: ${PORTAL_HOST}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: access-portal
                          port:
                            number: 80
          EOF

          kubectl -n argocd rollout status deployment/access-portal --timeout=120s

          for ns in stack-wordpress stack-ghost stack-gitea stack-mattermost stack-nextcloud keycloak metabase wikijs; do
            kubectl create namespace "${ns}" --dry-run=client -o yaml | kubectl apply -f -
            kubectl label namespace "${ns}" \
              pod-security.kubernetes.io/enforce=baseline \
              pod-security.kubernetes.io/audit=restricted \
              tier=app-catalog \
              --overwrite
          done

          kubectl create namespace security --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace security \
            pod-security.kubernetes.io/enforce=privileged \
            pod-security.kubernetes.io/audit=restricted \
            tier=platform \
            --overwrite

          kubectl label namespace monitoring \
            pod-security.kubernetes.io/enforce=privileged \
            pod-security.kubernetes.io/audit=restricted \
            tier=platform \
            --overwrite

          cat <<EOF | kubectl apply -f -
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: argocd-nip-io
            namespace: argocd
          spec:
            ingressClassName: nginx
            rules:
              - host: ${ARGOCD_HOST}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: argocd-server
                          port:
                            number: 80
          EOF

          kubectl -n monitoring delete ingress monitoring-nip-io --ignore-not-found

          cat <<EOF | kubectl apply -f -
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: monitoring-direct-access
            namespace: monitoring
            labels:
              app.kubernetes.io/name: monitoring-direct-access
              app.kubernetes.io/part-of: platform
              app.kubernetes.io/component: monitoring
          spec:
            ingressClassName: nginx
            rules:
              - host: grafana.${INGRESS_IP}.nip.io
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: kube-prometheus-stack-grafana
                          port:
                            number: 80
              - host: prometheus.${INGRESS_IP}.nip.io
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: kube-prometheus-stack-prometheus
                          port:
                            number: 9090
              - host: alertmanager.${INGRESS_IP}.nip.io
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: kube-prometheus-stack-alertmanager
                          port:
                            number: 9093
          EOF

          cat <<EOF | kubectl apply -f -
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: app-catalog-nip-io
            namespace: stack-wordpress
          spec:
            ingressClassName: nginx
            rules:
              - host: wordpress.${INGRESS_IP}.nip.io
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: wordpress
                          port:
                            number: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: app-catalog-nip-io
            namespace: stack-ghost
          spec:
            ingressClassName: nginx
            rules:
              - host: ghost.${INGRESS_IP}.nip.io
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: ghost
                          port:
                            number: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: app-catalog-nip-io
            namespace: stack-gitea
          spec:
            ingressClassName: nginx
            rules:
              - host: gitea.${INGRESS_IP}.nip.io
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: gitea
                          port:
                            number: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: app-catalog-nip-io
            namespace: stack-mattermost
          spec:
            ingressClassName: nginx
            rules:
              - host: slack.${INGRESS_IP}.nip.io
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: mattermost
                          port:
                            number: 8065
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: app-catalog-nip-io
            namespace: stack-nextcloud
          spec:
            ingressClassName: nginx
            rules:
              - host: cloud.${INGRESS_IP}.nip.io
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: nextcloud
                          port:
                            number: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: app-catalog-aliases-nip-io
            namespace: tenant-alpha
          spec:
            ingressClassName: nginx
            rules:
              - host: flask.${INGRESS_IP}.nip.io
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: service-alpha
                          port:
                            number: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: app-catalog-aliases-nip-io
            namespace: tenant-beta
          spec:
            ingressClassName: nginx
            rules:
              - host: node-api.${INGRESS_IP}.nip.io
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: node-api
                          port:
                            number: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: app-catalog-aliases-nip-io
            namespace: tenant-gamma
          spec:
            ingressClassName: nginx
            rules:
              - host: react.${INGRESS_IP}.nip.io
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: react
                          port:
                            number: 80
          EOF

          cat <<EOF | kubectl apply -f -
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: devsecops-nip-io
            namespace: keycloak
          spec:
            ingressClassName: nginx
            rules:
              - host: keycloak.${INGRESS_IP}.nip.io
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: keycloak
                          port:
                            number: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: devsecops-nip-io
            namespace: metabase
          spec:
            ingressClassName: nginx
            rules:
              - host: metabase.${INGRESS_IP}.nip.io
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: metabase
                          port:
                            number: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: devsecops-nip-io
            namespace: wikijs
          spec:
            ingressClassName: nginx
            rules:
              - host: wikijs.${INGRESS_IP}.nip.io
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: wikijs
                          port:
                            number: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: devsecops-nip-io
            namespace: security
          spec:
            ingressClassName: nginx
            rules:
              - host: vault.${INGRESS_IP}.nip.io
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: vault-ui
                          port:
                            number: 8200
              - host: falco.${INGRESS_IP}.nip.io
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: falco-falcosidekick-ui
                          port:
                            number: 2802
              - host: trivy.${INGRESS_IP}.nip.io
                http:
                  paths:
                    - path: /metrics
                      pathType: Prefix
                      backend:
                        service:
                          name: trivy-operator
                          port:
                            number: 80
          EOF

          {
            echo "## Acces publics nip.io"
            echo ""
            echo "- IP publique ingress-nginx: ${INGRESS_IP}"
            echo "- Portail: http://${PORTAL_HOST}"
            echo "- ArgoCD: http://${ARGOCD_HOST}"
            echo "- Grafana direct: http://grafana.${INGRESS_IP}.nip.io"
            echo "- Prometheus direct: http://prometheus.${INGRESS_IP}.nip.io"
            echo "- Alertmanager direct: http://alertmanager.${INGRESS_IP}.nip.io"
            echo "- WordPress + MySQL: http://wordpress.${INGRESS_IP}.nip.io"
            echo "- Messagerie Mattermost: http://slack.${INGRESS_IP}.nip.io"
            echo "- Ghost: http://ghost.${INGRESS_IP}.nip.io"
            echo "- Gitea: http://gitea.${INGRESS_IP}.nip.io"
            echo "- Cloud Nextcloud: http://cloud.${INGRESS_IP}.nip.io"
            echo "- Node API: http://node-api.${INGRESS_IP}.nip.io"
            echo "- Flask API: http://flask.${INGRESS_IP}.nip.io"
            echo "- React: http://react.${INGRESS_IP}.nip.io"
            echo "- Keycloak: http://keycloak.${INGRESS_IP}.nip.io"
            echo "- Vault: http://vault.${INGRESS_IP}.nip.io"
            echo "- Metabase: http://metabase.${INGRESS_IP}.nip.io"
            echo "- Wiki.js: http://wikijs.${INGRESS_IP}.nip.io"
            echo "- Falco/Falcosidekick: http://falco.${INGRESS_IP}.nip.io"
            echo "- Trivy Operator metrics: http://trivy.${INGRESS_IP}.nip.io/metrics"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  get-argocd-password:
    name: Get ArgoCD initial password
    runs-on: ubuntu-latest
    if: inputs.task == 'get-argocd-password' || inputs.task == 'reset-argocd-password'

    steps:
      - name: Get kubeconfig
        run: |
          CLUSTER_ID="${CLUSTER_ID_DEV:-}"
          if [ -z "${CLUSTER_ID}" ]; then
            CLUSTER_ID="$(curl -fsSL \
              -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
              "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters" \
              | jq -r '.clusters[] | select(.name == "devops-factory-dev") | .id' \
              | head -n 1)"
          fi
          test -n "${CLUSTER_ID}"
          curl -fsSL \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters/${CLUSTER_ID}/kubeconfig?dl=1" \
            -o kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          CLUSTER_ID_DEV: ${{ secrets.CLUSTER_ID_DEV }}

      - name: Print initial ArgoCD admin password
        if: inputs.task == 'get-argocd-password'
        run: |
          echo "::warning::Changer ce mot de passe immediatement"
          kubectl -n argocd get secret argocd-initial-admin-secret \
            -o jsonpath='{.data.password}' | base64 -d
          echo

      - name: Reset ArgoCD admin password
        if: inputs.task == 'reset-argocd-password'
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2-utils

          NEW_PASSWORD="ChangeMe-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-DevOpsFactory!"
          HASH="$(htpasswd -bnBC 10 "" "${NEW_PASSWORD}" | tr -d ':\n' | sed 's/$2y/$2a/')"

          kubectl -n argocd patch secret argocd-secret \
            --type merge \
            -p "$(jq -n \
              --arg hash "${HASH}" \
              '{"stringData":{"admin.password":$hash}}')"

          kubectl -n argocd patch secret argocd-secret \
            --type json \
            -p='[{"op":"remove","path":"/data/admin.passwordMtime"}]' || true

          kubectl -n argocd patch configmap argocd-cmd-params-cm \
            --type merge \
            -p '{"data":{"server.insecure":"true"}}'

          kubectl -n argocd patch ingress argocd-nip-io \
            --type json \
            -p='[{"op":"remove","path":"/metadata/annotations/nginx.ingress.kubernetes.io~1backend-protocol"}]' || true

          kubectl -n argocd patch ingress argocd-nip-io \
            --type json \
            -p='[{"op":"replace","path":"/spec/rules/0/http/paths/0/backend/service/port/number","value":80}]' || true

          kubectl -n argocd rollout restart deployment/argocd-server
          kubectl -n argocd rollout status deployment/argocd-server --timeout=180s

          {
            echo "## Mot de passe administrateur ArgoCD reinitialise"
            echo ""
            echo "- utilisateur: admin"
            echo "- mot de passe: ${NEW_PASSWORD}"
            echo ""
            echo "Changer ce mot de passe immediatement apres connexion."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  diagnose-apps:
    name: Diagnose exposed applications
    runs-on: ubuntu-latest
    if: inputs.task == 'diagnose-apps'

    steps:
      - name: Get kubeconfig
        run: |
          CLUSTER_ID="${CLUSTER_ID_DEV:-}"
          if [ -z "${CLUSTER_ID}" ]; then
            CLUSTER_ID="$(curl -fsSL \
              -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
              "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters" \
              | jq -r '.clusters[] | select(.name == "devops-factory-dev") | .id' \
              | head -n 1)"
          fi
          test -n "${CLUSTER_ID}"
          curl -fsSL \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            "https://api.scaleway.com/k8s/v1/regions/fr-par/clusters/${CLUSTER_ID}/kubeconfig?dl=1" \
            -o kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          CLUSTER_ID_DEV: ${{ secrets.CLUSTER_ID_DEV }}

      - name: Inspect Kubernetes resources
        run: |
          set -euo pipefail
          namespaces=(
            argocd
            monitoring
            stack-wordpress
            stack-mattermost
            stack-ghost
            stack-gitea
            stack-nextcloud
            keycloak
            metabase
            wikijs
            security
            tenant-alpha
            tenant-beta
            tenant-gamma
          )

          {
            echo "## Diagnostics des applications Kubernetes"
            echo ""
            echo "### ArgoCD applications"
            echo '```'
            kubectl -n argocd get applications.argoproj.io -o wide || true
            echo '```'
            echo ""
            echo "### Pods, services et endpoints"
          } >> "$GITHUB_STEP_SUMMARY"

          for ns in "${namespaces[@]}"; do
            {
              echo ""
              echo "#### ${ns}"
              echo '```'
              kubectl -n "${ns}" get pods,svc,endpoints,ingress -o wide || true
              echo ""
              echo "# Events"
              kubectl -n "${ns}" get events --sort-by='.lastTimestamp' | tail -n 30 || true
              echo ""
              echo "# Pods non prets"
              for pod in $(kubectl -n "${ns}" get pods --no-headers 2>/dev/null | awk '{split($2, ready, "/"); if (ready[1] != ready[2] || $3 != "Running") print $1}'); do
                echo "## ${pod}"
                kubectl -n "${ns}" describe pod "${pod}" | sed -n '/Events:/,$p' || true
              done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Test public nip.io URLs
        run: |
          set -euo pipefail
          INGRESS_IP="$(kubectl -n ingress-nginx get svc ingress-nginx-controller \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"

          hosts=(
            portal
            argocd
            wordpress
            slack
            ghost
            gitea
            cloud
            node-api
            flask
            react
            keycloak
            vault
            metabase
            wikijs
            falco
          )

          {
            echo ""
            echo "### Verification HTTP publique"
            echo ""
            echo "| Application | URL | Code HTTP |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for host in "${hosts[@]}"; do
            path="/"
            case "${host}" in
              node-api|flask|react)
                path="/health"
                ;;
            esac
            url="http://${host}.${INGRESS_IP}.nip.io${path}"
            code="$(curl -k -sS -o /tmp/health-body -w '%{http_code}' --max-time 20 "${url}" || true)"
            if [ -z "${code}" ]; then
              code="000"
            fi
            echo "| ${host} | ${url} | ${code} |" >> "$GITHUB_STEP_SUMMARY"
          done

          trivy_url="http://trivy.${INGRESS_IP}.nip.io/metrics"
          trivy_code="$(curl -k -sS -o /tmp/health-body -w '%{http_code}' --max-time 20 "${trivy_url}" || true)"
          echo "| trivy | ${trivy_url} | ${trivy_code:-000} |" >> "$GITHUB_STEP_SUMMARY"
